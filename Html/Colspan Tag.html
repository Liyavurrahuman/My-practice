<body>
    <center><u><h1>Table Tag</h1></u></center>


<u><h3>Colspan Tag</h3></u>
<table border="1" cellpadding="5" cellspacing="5" width="25%">
<tr aling="center">
<th colspan="4">Title</th>

</tr>
<tr>
<th colspan="2">subtitle</th><th colspan="2">subtitle</th>
</tr>

<tr>
<td>1 item <br> 1 item <br> 1 item</td>

<td>1 item <br> 1 item <br> 1 item</td>
<td>123<br> 123 <br> 123</td>
</tr>
<tr>

   <th colspan="2">subtitle</th><th colspan="2">subtitle</th>
</tr>



</table>
<hr>

<u><h3>Rowspan Tag</h3></u>

<tr>

</tr>




</tr>

</html>
